<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Private Area - DigQuest</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- LOGIN CHECK -->
<script>
if (localStorage.getItem("loggedIn") !== "true") {
  window.location.href = "permissions.html";
}
</script>

<header class="hero">
  <div class="hero-content">
    <h1>Permissions Area</h1>
    <p>Authorized access only</p>

    <nav>
      <a href="index.html">Home</a>
      <a href="gallery.html">Finds</a>
      <a href="permissions.html">Permissions</a>
    </nav>
  </div>
</header>

<main>

  <h2 style="text-align:center;">Private Permissions</h2>

  <!-- SEARCH -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search..." onkeyup="searchFields()">
  </div>

  <!-- FILTERS -->
  <div class="filters">
    <button onclick="filterFields('all', this)" class="button filter-btn active">All</button>
    <button onclick="filterFields('coins', this)" class="button filter-btn">Coins</button>
    <button onclick="filterFields('relics', this)" class="button filter-btn">Relics</button>
  </div>

  <!-- GRID -->
  <div class="permission-grid">

    <div class="permission-card" data-tags="coins">
      <h3>Field 1</h3>

      <div class="tags">
        <span class="tag">Coins</span>
      </div>

      <iframe src="https://www.google.com/maps/embed?pb=!1m18!..." ></iframe>

      <p><strong>Notes:</strong> Good coin area</p>
    </div>

    <div class="permission-card" data-tags="relics">
      <h3>Field 2</h3>

      <div class="tags">
        <span class="tag">Relics</span>
      </div>

      <iframe src="https://www.google.com/maps/embed?pb=!1m18!..." ></iframe>

      <p><strong>Notes:</strong> Strong signals</p>
    </div>

  </div>

  <br>
  <div style="text-align:center;">
    <button class="button" onclick="logout()">Logout</button>
  </div>

</main>

<footer>
  <p>© DigQuest</p>
</footer>

<script>
function filterFields(tag, button) {
  let cards = document.querySelectorAll(".permission-card");
  let buttons = document.querySelectorAll(".filter-btn");

  buttons.forEach(btn => btn.classList.remove("active"));
  button.classList.add("active");

  cards.forEach(card => {
    if (tag === "all" || card.dataset.tags.includes(tag)) {
      card.style.display = "block";
    } else {
      card.style.display = "none";
    }
  });
}

function searchFields() {
  let input = document.getElementById("searchInput").value.toLowerCase();
  let cards = document.querySelectorAll(".permission-card");

  cards.forEach(card => {
    let text = card.innerText.toLowerCase();
    card.style.display = text.includes(input) ? "block" : "none";
  });
}

function logout() {
  localStorage.removeItem("loggedIn");
  window.location.href = "permissions.html";
}
</script>

</body>
</html>
